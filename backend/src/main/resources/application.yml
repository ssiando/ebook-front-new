spring:
  application:
    name: ebook-backend

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/ebook}
    username: ${DB_USERNAME:ipnac}
    password: ${DB_PASSWORD:ipnac}
    driver-class-name: org.mariadb.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# p6spy-spring-boot-starter(gavlyukovskiy)는 기본 설정으로도 실행 SQL을 p6spy 로거로 출력합니다.
# 로그 포맷/필터를 세밀하게 조정하려면 decorator.datasource.p6spy.* 프로퍼티를 확인해
# 최신 스타터 문서 기준으로 추가하세요 (여기서는 기본값을 그대로 사용).

  security:
    oauth2:
      resourceserver:
        jwt:
          # TODO: 실제 인가서버(Keycloak 등) 확정 후 issuer-uri 채우기.
          issuer-uri: ${OAUTH2_ISSUER_URI:}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

server:
  port: ${SERVER_PORT:8080}

logging:
  config: classpath:logback.xml
